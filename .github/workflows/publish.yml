name: Publish to datarail.org

# Copies site/ into datarail-site/public/bagel. datarail-site's own deploy
# workflow then ships it to IONOS on push. This repository never touches the
# web server or its credentials.
#
# Off until the repository variable PUBLISH_TO_SITE is set to true and the
# DATARAIL_SITE_DEPLOY_KEY secret holds the private half of a write deploy key
# on fvtale/datarail-site. Every run still validates in the meantime.
#
# A deploy key rather than a token, same as the library, the coffee board and NYPizza:
# scoped to one repository by construction, never expires, and a push made
# with it triggers datarail-site's deploy, which GITHUB_TOKEN would not.

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'scripts/**'
      - '.github/workflows/publish.yml'
  workflow_dispatch:

concurrency:
  group: bagel-publish
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the bagel site
        uses: actions/checkout@v5
        with:
          path: bagel

      - uses: actions/setup-node@v5
        with:
          node-version: '24'

      # Same checks CI runs, repeated so a manual dispatch cannot route around them.
      - name: Validate before publishing
        working-directory: bagel
        run: |
          node scripts/validate.mjs
          node scripts/sync-seed.mjs --check

      - name: Publishing is switched off
        if: vars.PUBLISH_TO_SITE != 'true'
        run: echo "::notice title=Validated, not published::Set the PUBLISH_TO_SITE variable to true and add the DATARAIL_SITE_DEPLOY_KEY secret to copy this into datarail-site."

      - name: Check out the site
        if: vars.PUBLISH_TO_SITE == 'true'
        uses: actions/checkout@v5
        with:
          repository: fvtale/datarail-site
          ssh-key: ${{ secrets.DATARAIL_SITE_DEPLOY_KEY }}
          path: site

      - name: Copy the page into place
        if: vars.PUBLISH_TO_SITE == 'true'
        run: |
          mkdir -p site/public/bagel
          rsync -a --delete bagel/site/ site/public/bagel/

      - name: Commit to the site
        if: vars.PUBLISH_TO_SITE == 'true'
        working-directory: site
        run: |
          # status, not diff: diff cannot see files that are new to the folder.
          if [ -z "$(git status --porcelain -- public/bagel)" ]; then
            echo "site already matches, nothing to push"
            exit 0
          fi
          git config user.name  "bagel"
          git config user.email "contact@datarail.org"
          git add public/bagel
          git commit -m "Update Bagel Sunrise Sets (bagel@${GITHUB_SHA::12})"
          # Other repositories push here too. Rebase rather than force.
          git pull --rebase origin main
          git push origin HEAD:main
